services:
  lb:
    image: haproxy:2.9-alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - backend-sockets:/sockets
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:ca8bcdbea05b4c55a22739447e4f9ee68df0e8f8
    platform: linux/amd64
    environment:
      BIND_ADDR: unix:/sockets/api1.sock
      INDEX_PATH: /app/data/references.idx
      PREFETCH_INDEX: "true"
      WORKERS: "2"
      KEEP_ALIVE_REQUESTS: "256"
      EARLY_CANDIDATES: "16200"
      MIN_CANDIDATES: "16200"
      MAX_CANDIDATES: "32400"
      PROFILE_FASTPATH: "1"
      PROFILE_MIN_COUNT: "20"
      EXACT_FALLBACK: "risky"
      OVERLOAD_MIN_CANDIDATES: "3000"
      OVERLOAD_MAX_CANDIDATES: "32400"
      OVERLOAD_THRESHOLD: "0"
      OVERLOAD_FAST_ONLY: "true"
      SEARCH_FALLBACK_LAST_DISTANCE: "2900"
      FAST_PATH: "false"
    volumes:
      - backend-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:ca8bcdbea05b4c55a22739447e4f9ee68df0e8f8
    platform: linux/amd64
    environment:
      BIND_ADDR: unix:/sockets/api2.sock
      INDEX_PATH: /app/data/references.idx
      PREFETCH_INDEX: "true"
      WORKERS: "2"
      KEEP_ALIVE_REQUESTS: "256"
      EARLY_CANDIDATES: "16200"
      MIN_CANDIDATES: "16200"
      MAX_CANDIDATES: "32400"
      PROFILE_FASTPATH: "1"
      PROFILE_MIN_COUNT: "20"
      EXACT_FALLBACK: "risky"
      OVERLOAD_MIN_CANDIDATES: "3000"
      OVERLOAD_MAX_CANDIDATES: "32400"
      OVERLOAD_THRESHOLD: "0"
      OVERLOAD_FAST_ONLY: "true"
      SEARCH_FALLBACK_LAST_DISTANCE: "2900"
      FAST_PATH: "false"
    volumes:
      - backend-sockets:/sockets
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "156MB"

volumes:
  backend-sockets:
