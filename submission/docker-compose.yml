services:
  lb:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:latest
    platform: linux/amd64
    cpuset: "0,2"
    entrypoint: ["rinha-lb"]
    environment:
      LB_MODE: fdpass
      LB_PRECONNECT_CONTROL: "1"
      LB_ACCEPT_BATCH: "128"
      LB_BACKLOG: "65535"
      UPSTREAMS: /sockets/api1.sock.ctrl,/sockets/api2.sock.ctrl
    ports:
      - "9999:9999"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "${LB_CPUS:-0.16}"
          memory: "32MB"

  api1:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:latest
    platform: linux/amd64
    cpuset: "0,1"
    environment:
      BIND_ADDR: fd:/sockets/api1.sock.ctrl
      FD_EPOLL_RAW: "1"
      INDEX_PATH: /app/data/references.idx
      INDEX_HUGEPAGES: "1"
      PREFETCH_INDEX: "true"
      WORKERS: "${API_WORKERS:-2}"
      KEEP_ALIVE_REQUESTS: "${KEEP_ALIVE_REQUESTS:-256}"
      EARLY_CANDIDATES: "4500"
      MIN_CANDIDATES: "4500"
      MAX_CANDIDATES: "5500"
      PROFILE_FASTPATH: "1"
      PROFILE_FASTPATH_REFERENCE_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      EXPECTED_REFERENCES_GZIP_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      PROFILE_MIN_COUNT: "15"
      PROFILE_LEGIT_MIN_COUNT: "15"
      PROFILE_FRAUD_MIN_COUNT: "15"
      PROFILE_DOMINANT_FASTPATH: "0"
      PROFILE_DOMINANT_MIN_COUNT: "15"
      PROFILE_DOMINANT_MAX_OPPOSITE: "2"
      EXACT_FALLBACK: "risky"
      RISKY_SEMANTIC_GROUPS: "1"
      RISKY_SEMANTIC_RADIUS: "2"
      EARLY_EDGE_FALLBACK: "1"
      RISKY_AMOUNT_MIN: "400"
      RISKY_AMOUNT_MAX: "3000"
      RISKY_INSTALLMENTS_MIN: "2200"
      RISKY_INSTALLMENTS_MAX: "6200"
      RISKY_RATIO_MIN: "850"
      RISKY_KM_HOME_MIN: "250"
      RISKY_KM_HOME_MAX: "4000"
      RISKY_TX24H_MAX: "5800"
      RISKY_MERCHANT_AVG_MAX: "420"
      OVERLOAD_MIN_CANDIDATES: "3000"
      OVERLOAD_MAX_CANDIDATES: "32400"
      OVERLOAD_THRESHOLD: "0"
      OVERLOAD_FAST_ONLY: "true"
      SEARCH_FALLBACK_LAST_DISTANCE: "2900"
      FAST_PATH: "false"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.42}"
          memory: "156MB"

  api2:
    image: ghcr.io/daniloitagyba/rinha-2026-rust:latest
    platform: linux/amd64
    cpuset: "2,3"
    environment:
      BIND_ADDR: fd:/sockets/api2.sock.ctrl
      FD_EPOLL_RAW: "1"
      INDEX_PATH: /app/data/references.idx
      INDEX_HUGEPAGES: "1"
      PREFETCH_INDEX: "true"
      WORKERS: "${API_WORKERS:-2}"
      KEEP_ALIVE_REQUESTS: "${KEEP_ALIVE_REQUESTS:-256}"
      EARLY_CANDIDATES: "4500"
      MIN_CANDIDATES: "4500"
      MAX_CANDIDATES: "5500"
      PROFILE_FASTPATH: "1"
      PROFILE_FASTPATH_REFERENCE_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      EXPECTED_REFERENCES_GZIP_SHA256: "43d10de80609e77ce25740f375607afce7561ec44da50c27c142493db8fcab67"
      PROFILE_MIN_COUNT: "15"
      PROFILE_LEGIT_MIN_COUNT: "15"
      PROFILE_FRAUD_MIN_COUNT: "15"
      PROFILE_DOMINANT_FASTPATH: "0"
      PROFILE_DOMINANT_MIN_COUNT: "15"
      PROFILE_DOMINANT_MAX_OPPOSITE: "2"
      EXACT_FALLBACK: "risky"
      RISKY_SEMANTIC_GROUPS: "1"
      RISKY_SEMANTIC_RADIUS: "2"
      EARLY_EDGE_FALLBACK: "1"
      RISKY_AMOUNT_MIN: "400"
      RISKY_AMOUNT_MAX: "3000"
      RISKY_INSTALLMENTS_MIN: "2200"
      RISKY_INSTALLMENTS_MAX: "6200"
      RISKY_RATIO_MIN: "850"
      RISKY_KM_HOME_MIN: "250"
      RISKY_KM_HOME_MAX: "4000"
      RISKY_TX24H_MAX: "5800"
      RISKY_MERCHANT_AVG_MAX: "420"
      OVERLOAD_MIN_CANDIDATES: "3000"
      OVERLOAD_MAX_CANDIDATES: "32400"
      OVERLOAD_THRESHOLD: "0"
      OVERLOAD_FAST_ONLY: "true"
      SEARCH_FALLBACK_LAST_DISTANCE: "2900"
      FAST_PATH: "false"
    volumes:
      - backend-sockets:/sockets
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.42}"
          memory: "156MB"

volumes:
  backend-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777

networks:
  default:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "true"
